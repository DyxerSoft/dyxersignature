name: Stellar Testnet API end-to-end

on:
  push:
    branches:
      - feat/stellar-hackathon-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-testnet-e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[stellar-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build Testnet smoke client
        run: dotnet build backend/tools/StellarTestnetSmoke/StellarTestnetSmoke.csproj --configuration Release
      - name: Generate masked ephemeral Compose credentials
        shell: bash
        run: |
          set -euo pipefail
          write_secret() {
            local name="$1"
            local value="$2"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }
          write_secret POSTGRES_PASSWORD "$(openssl rand -hex 32)"
          write_secret AUTH_JWT_SIGNING_KEY "$(openssl rand -hex 32)"
          write_secret S3_ADMIN_ACCESS_KEY "sig$(openssl rand -hex 8)"
          write_secret S3_ADMIN_SECRET_KEY "$(openssl rand -hex 32)"
          write_secret S3_ACCESS_KEY "api$(openssl rand -hex 8)"
          write_secret S3_SECRET_KEY "$(openssl rand -hex 32)"
          printf 'S3_PUBLIC_URL=http://localhost:8333\n' >> "$GITHUB_ENV"
      - name: Fund an ephemeral Testnet account without logging its seed
        run: dotnet run --project backend/tools/StellarTestnetSmoke/StellarTestnetSmoke.csproj --configuration Release --no-build -- --provision-compose "$GITHUB_ENV"
      - name: Start PostgreSQL, SeaweedFS, and the API
        run: docker compose up --build --detach api
      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Create, correct, sign, anchor, verify, and download through the API
        run: dotnet run --project backend/tools/StellarTestnetSmoke/StellarTestnetSmoke.csproj --configuration Release --no-build -- --api-e2e http://127.0.0.1:8080
      - name: Stop isolated Compose services and remove their volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

