name: MVP load test

on:
  push:
    branches: [feat/stellar-hackathon-mvp]
    paths:
      - 'scripts/load/**'
      - 'docker-compose.yml'
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    paths:
      - 'scripts/load/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:
    inputs:
      vus:
        description: Concurrent virtual users
        required: true
        default: '100'
      duration:
        description: Test duration, for example 60s
        required: true
        default: '60s'

permissions:
  contents: read

jobs:
  api-load-test:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[load-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      K6_VUS: ${{ inputs.vus || '100' }}
      K6_DURATION: ${{ inputs.duration || '60s' }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral local credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          values = {
              "POSTGRES_PASSWORD": base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip("="),
              "AUTH_JWT_SIGNING_KEY": base64.urlsafe_b64encode(os.urandom(48)).decode().rstrip("="),
              "S3_ADMIN_ACCESS_KEY": "sigtestadmin" + base64.urlsafe_b64encode(os.urandom(12)).decode().rstrip("="),
              "S3_ADMIN_SECRET_KEY": base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip("="),
              "S3_ACCESS_KEY": "sigtestapi" + base64.urlsafe_b64encode(os.urandom(12)).decode().rstrip("="),
              "S3_SECRET_KEY": base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip("="),
              "S3_PUBLIC_URL": "http://seaweedfs:8333",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  print(f"::add-mask::{value}", flush=True)
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Start Compose stack
        run: docker compose up -d --build
      - name: Record runtime versions
        shell: bash
        run: |
          mkdir -p artifacts
          {
            cat /etc/os-release
            printf '\nDocker server: '
            docker version --format '{{.Server.Version}}'
            printf 'Docker Compose: '
            docker compose version --short
            printf '\nCompose images:\n'
            docker compose images
          } > artifacts/runtime-environment.txt
      - name: Wait for API health
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200 api postgres seaweedfs
          exit 1
      - name: Run 100-user signed-document workflow test
        run: |
          mkdir -p artifacts
          api_container="$(docker compose ps -q api)"
          if [ -z "$api_container" ]; then
            echo "API container is not running; cannot identify its Compose network." >&2
            exit 1
          fi
          api_network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$api_container")"
          if [ -z "$api_network" ]; then
            echo "Could not identify the API container's Compose network." >&2
            exit 1
          fi
          docker run --rm --network "$api_network" --user "$(id -u):$(id -g)" \
            --workdir /artifacts \
            -e BASE_URL=http://api:8080 \
            -e K6_VUS -e K6_DURATION \
            -v "$PWD/scripts/load:/scripts:ro" \
            -v "$PWD/artifacts:/artifacts" \
            grafana/k6:0.54.0 run /scripts/k6-contracts.js
      - name: Upload load-test measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dyxersignature-load-test-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Collect Compose diagnostics
        if: failure()
        run: docker compose logs --tail=300
      - name: Stop ephemeral Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

