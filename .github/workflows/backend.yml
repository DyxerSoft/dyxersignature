name: Backend

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore backend/DyxerSignature.slnx
      - name: Build
        run: dotnet build backend/DyxerSignature.slnx --configuration Release --no-restore
      - name: Tests
        run: dotnet test backend/DyxerSignature.slnx --configuration Release --no-build
      - name: Docker image build
        run: docker build --file backend/Dockerfile --tag dyxersignature-api:ci .
